server:
  port: ${VAARL_API_PORT:8080}

spring:
  datasource:
    url: ${VAARL_DB_URL:jdbc:postgresql://${VAARL_DB_HOST:localhost}:${VAARL_DB_PORT:5432}/${VAARL_DB_NAME:vaarl_db}}
    username: ${VAARL_DB_USER}
    password: ${VAARL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${VAARL_SMTP_HOST:localhost}
    port: ${VAARL_SMTP_PORT:587}
    username: ${VAARL_SMTP_USER:}
    password: ${VAARL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${VAARL_SMTP_AUTH:true}
          starttls:
            enable: ${VAARL_SMTP_STARTTLS:true}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

vaarl:
  jwt:
    secret: ${VAARL_JWT_SECRET}
    expires-seconds: ${VAARL_JWT_EXPIRES_SECONDS:3600}
  password-reset-url: ${VAARL_PASSWORD_RESET_URL:http://localhost:5173/reset-password}
  email-verification-url: ${VAARL_EMAIL_VERIFICATION_URL:http://localhost:5173/verify-email}
  resend-api-key: ${VAARL_RESEND_API_KEY:}
  email-from: ${VAARL_EMAIL_FROM:onboarding@resend.dev}
