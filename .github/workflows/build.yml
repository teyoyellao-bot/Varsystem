name: VAARL Build Check

on:
  push:
    branches:
      - web-system-development
  pull_request:
    branches:
      - web-system-development

jobs:
  backend:
    name: Backend compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build backend
        run: mvn -B -f web-backend/pom.xml clean verify

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: web-frontend
        run: npm install
      - name: Build frontend
        working-directory: web-frontend
        run: npm run build
